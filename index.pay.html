<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout Payment</title>
    <link rel="stylesheet" href="style.pay.css" />
  </head>
  <body>
    <header>
      <h1>Checkout</h1>
    </header>

    <main>
      <div class="cart-summary">
        <h2>Your Cart</h2>
        <ul id="cart-items">
          <li>
            <img
              src="https://lh3.googleusercontent.com/p/AF1QipOjNrvu-2BmOlrZcfI3e8PIN35xEwAFe6hPo6C_=s680-w680-h510-rw"
              alt="Summer Tops"
              width="100"
            />
            <span>Summer Tops - Zara</span>
            <strong>$29.99</strong>
          </li>
        </ul>
        <p><strong>Total:</strong> $<span id="cart-total">29.99</span></p>
      </div>

      <div class="checkout-form">
        <h2>Payment Details</h2>
        <form id="payment-form">
          <label for="name">Full Name:</label>
          <input type="text" id="name" required />

          <label for="card-number">Card Number:</label>
          <input type="text" id="card-number" maxlength="16" required />

          <label for="expiry">Expiry Date:</label>
          <input type="month" id="expiry" required />

          <label for="cvv">CVV:</label>
          <input type="text" id="cvv" maxlength="3" required />

          <button type="submit">Pay Now</button>
        </form>

        <p id="payment-status"></p>
      </div>
    </main>

    <script src="script.pay.js"></script>
  </body>
</html>
